<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>una preguntita... ♥</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Mono:wght@300;400&display=swap"
    rel="stylesheet"
  />
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #080808;
      --text: #f2ece4;
      --accent: #ff7eb3;
      --accent2: #c084fc;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: 'Cormorant Garamond', serif;
      overflow-x: hidden;
    }

    /* subtle grain overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      background-size: 200px 200px;
      pointer-events: none;
      z-index: 0;
      opacity: 0.4;
    }

    /* ── HEARTS ─────────────────────────────────────── */
    .heart {
      position: fixed;
      pointer-events: none;
      z-index: 1;
      animation: floatUp linear infinite;
      will-change: transform, opacity;
      user-select: none;
    }

    @keyframes floatUp {
      0%   { transform: translateY(105vh) rotate(-15deg) scale(0.6); opacity: 0; }
      8%   { opacity: 1; }
      85%  { opacity: 0.9; }
      100% { transform: translateY(-15vh) rotate(25deg) scale(1.1);  opacity: 0; }
    }

    /* ── TYPEWRITER SECTION ─────────────────────────── */
    #typewriter-section {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
      gap: 0;
      transition: opacity 1.6s ease;
    }

    .lane-wrap {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .lane {
      font-family: 'DM Mono', monospace;
      font-size: clamp(0.9rem, 2.2vw, 1.25rem);
      font-weight: 300;
      letter-spacing: 0.04em;
      color: var(--text);
      min-height: 1.8em;
      line-height: 1.7;
      position: relative;
    }

    .lane::after {
      content: '|';
      color: var(--accent);
      animation: blink 0.75s step-end infinite;
      margin-left: 1px;
    }

    .lane.cursor-off::after {
      display: none;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    .lane-divider {
      width: 48px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      margin: 0.2rem 0;
      opacity: 0.5;
    }

    /* ── INVITE SECTION ─────────────────────────────── */
    #invite-section {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 5rem 2rem;
      text-align: center;
      opacity: 0;
      transition: opacity 2s ease;
    }

    #invite-section.visible {
      display: flex;
    }

    #invite-section.fade-in {
      opacity: 1;
    }

    .invite-glow {
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,126,179,0.1) 0%, transparent 70%);
      pointer-events: none;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 0;
    }

    .invite-label {
      font-family: 'DM Mono', monospace;
      font-size: clamp(0.6rem, 1.2vw, 0.75rem);
      font-weight: 300;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 3rem;
      opacity: 0;
      transition: opacity 1s ease;
    }

    .invite-label.revealed { opacity: 0.75; }

    .invite-card {
      position: relative;
      z-index: 1;
      max-width: 520px;
      border: 1px solid rgba(255,126,179,0.18);
      border-radius: 2px;
      padding: 3.5rem 3rem;
      background: rgba(255,255,255,0.02);
      backdrop-filter: blur(4px);
      opacity: 0;
      transform: translateY(28px);
      transition: opacity 1.2s ease, transform 1.2s ease;
    }

    .invite-card.revealed {
      opacity: 1;
      transform: translateY(0);
    }

    .invite-date {
      font-family: 'DM Mono', monospace;
      font-size: clamp(0.65rem, 1.3vw, 0.8rem);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--accent2);
      margin-bottom: 2rem;
      opacity: 0;
      transition: opacity 0.9s ease 0.3s;
    }

    .invite-date.revealed { opacity: 0.8; }

    .invite-main {
      font-size: clamp(1.8rem, 5vw, 3rem);
      font-weight: 300;
      font-style: italic;
      line-height: 1.4;
      color: var(--text);
      margin-bottom: 0.6rem;
      opacity: 0;
      transform: translateY(14px);
      transition: opacity 1s ease 0.6s, transform 1s ease 0.6s;
    }

    .invite-main.revealed {
      opacity: 1;
      transform: translateY(0);
    }

    .invite-sub {
      font-family: 'DM Mono', monospace;
      font-size: clamp(0.7rem, 1.5vw, 0.9rem);
      font-weight: 300;
      letter-spacing: 0.08em;
      color: var(--text);
      opacity: 0;
      transition: opacity 0.9s ease 1s;
      margin-bottom: 2.8rem;
    }

    .invite-sub.revealed { opacity: 0.55; }

    .invite-divider {
      width: 60px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      margin: 0 auto 2.8rem;
      opacity: 0;
      transition: opacity 0.9s ease 1.3s;
    }

    .invite-divider.revealed { opacity: 0.4; }

    .invite-btn {
      display: inline-block;
      font-family: 'DM Mono', monospace;
      font-size: clamp(0.6rem, 1.2vw, 0.72rem);
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--accent);
      text-decoration: none;
      border: 1px solid rgba(255,126,179,0.35);
      padding: 0.8rem 2rem;
      border-radius: 1px;
      opacity: 0;
      transition: opacity 0.9s ease 1.6s, background 0.3s ease, color 0.3s ease;
      position: relative;
      z-index: 2;
    }

    .invite-btn:hover {
      background: rgba(255,126,179,0.12);
      color: #fff;
    }

    .invite-btn.revealed { opacity: 1; }

    .invite-btn--confirm {
      color: var(--accent2);
      border-color: rgba(192,132,252,0.35);
      transition: opacity 0.9s ease 1.9s, background 0.3s ease, color 0.3s ease;
    }

    .invite-btn--confirm:hover {
      background: rgba(192,132,252,0.12);
    }

    .invite-from {
      font-family: 'DM Mono', monospace;
      font-size: clamp(0.55rem, 1vw, 0.65rem);
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--accent2);
      margin-top: 3.5rem;
      opacity: 0;
      transition: opacity 1s ease 2s;
    }

    .invite-from.revealed { opacity: 0.5; }
  </style>
</head>
<body>

  <!-- TYPEWRITER -->
  <section id="typewriter-section">
    <div class="lane-wrap">
      <div class="lane" id="lane1"></div>
      <div class="lane-divider"></div>
      <div class="lane" id="lane2"></div>
    </div>
  </section>

  <!-- INVITE -->
  <section id="invite-section">
    <div class="invite-glow"></div>
    <p class="invite-label" id="invite-label">una invitacion</p>
    <div class="invite-card" id="invite-card">
      <p class="invite-date" id="invite-date">jueves · 4 de junio · 2026</p>
      <p class="invite-main" id="invite-main">¿quieres ir a cenar<br>conmigo esta noche?</p>
      <p class="invite-sub" id="invite-sub">tengo un lugar especial en mente para nosotros.</p>
      <div class="invite-divider" id="invite-divider"></div>
      <a class="invite-btn" id="invite-btn" href="https://maps.app.goo.gl/2HoT3h9ZL1Z8CEx78" target="_blank" rel="noopener">ver el restaurante ♥</a>
      <a class="invite-btn invite-btn--confirm" id="invite-confirm" href="https://wa.me/50662151059?text=si%20quiero%20ir%20%F0%9F%A4%8D" target="_blank" rel="noopener" style="margin-top:1rem;">si quiero ir ♥</a>
    </div>
    <p class="invite-from" id="invite-from">con amor · wes</p>
  </section>

  <script>
    // ─────────────────────────────────────────────────────
    //  HEARTS
    // ─────────────────────────────────────────────────────
    const HEART_COLORS = [
      '#ff6b8a', '#ff9eb5', '#ffb6c1', '#ffccd5',
      '#c084fc', '#d946ef', '#f0abfc',
      '#fb923c', '#fbbf24',
      '#67e8f9', '#34d399',
      '#f87171', '#ff4d6d',
    ];

    function spawnHeart() {
      const el = document.createElement('span');
      el.className = 'heart';
      el.textContent = '♥';
      const size = Math.random() * 20 + 8;
      el.style.cssText = `
        left: ${Math.random() * 100}vw;
        font-size: ${size}px;
        color: ${HEART_COLORS[Math.floor(Math.random() * HEART_COLORS.length)]};
        animation-duration: ${Math.random() * 9 + 7}s;
        animation-delay: ${Math.random() * 4}s;
        opacity: 0;
        text-shadow: 0 0 ${Math.round(size * 0.8)}px currentColor;
      `;
      document.body.appendChild(el);
      const ttl = (parseFloat(el.style.animationDuration) + parseFloat(el.style.animationDelay) + 1) * 1000;
      setTimeout(() => el.remove(), ttl);
    }

    for (let i = 0; i < 25; i++) setTimeout(spawnHeart, i * 120);
    setInterval(spawnHeart, 380);


    // ─────────────────────────────────────────────────────
    //  TYPEWRITER SEQUENCES
    // ─────────────────────────────────────────────────────
    const SEQUENCES = [
      ["hola isa,", "tengo algo que preguntarte..."],
      ["manana es jueves 4 de junio,", "y quiero que sea un dia especial."],
      ["quiero llevarte a cenar,", "a un lugar del que hemos hablado de ir,"],
      ["y creo que es la perfecta ocasion", "para ir a probarlo juntos."],
      ["solo tu y yo,", "una noche tranquila juntos."],
      ["porque me encanta cuando estamos juntos", "y quiero que tengas una noche increible."],
      ["entonces...", "♥"],
    ];


    // ─────────────────────────────────────────────────────
    //  ENGINE
    // ─────────────────────────────────────────────────────
    const lane1 = document.getElementById('lane1');
    const lane2 = document.getElementById('lane2');
    const twSection = document.getElementById('typewriter-section');
    const invSection = document.getElementById('invite-section');

    const wait = ms => new Promise(r => setTimeout(r, ms));

    function typeText(el, text, speed = 52) {
      return new Promise(resolve => {
        let i = 0;
        el.classList.remove('cursor-off');
        const iv = setInterval(() => {
          el.textContent += text[i++];
          if (i >= text.length) { clearInterval(iv); resolve(); }
        }, speed);
      });
    }

    function eraseText(el, speed = 28) {
      return new Promise(resolve => {
        const iv = setInterval(() => {
          if (!el.textContent.length) { clearInterval(iv); resolve(); return; }
          el.textContent = el.textContent.slice(0, -1);
        }, speed);
      });
    }

    async function runTypewriter() {
      for (const [t1, t2] of SEQUENCES) {
        await typeText(lane1, t1);
        await typeText(lane2, t2);
        await wait(2200);
        await Promise.all([eraseText(lane1), eraseText(lane2)]);
        await wait(450);
      }

      // fade out typewriter
      twSection.style.opacity = '0';
      await wait(1700);
      twSection.style.display = 'none';

      // show invite section
      invSection.classList.add('visible');
      await wait(50);
      invSection.classList.add('fade-in');

      // stagger reveal invite elements
      await wait(600);
      document.getElementById('invite-label').classList.add('revealed');
      await wait(500);
      document.getElementById('invite-card').classList.add('revealed');
      await wait(300);
      document.getElementById('invite-date').classList.add('revealed');
      await wait(400);
      document.getElementById('invite-main').classList.add('revealed');
      await wait(500);
      document.getElementById('invite-sub').classList.add('revealed');
      await wait(300);
      document.getElementById('invite-divider').classList.add('revealed');
      await wait(400);
      document.getElementById('invite-btn').classList.add('revealed');
      await wait(300);
      document.getElementById('invite-confirm').classList.add('revealed');
      await wait(600);
      document.getElementById('invite-from').classList.add('revealed');
    }

    runTypewriter();
  </script>
</body>
</html>
